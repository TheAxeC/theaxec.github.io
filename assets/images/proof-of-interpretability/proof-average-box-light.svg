<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 226" role="img" font-family="Helvetica, Arial, sans-serif"><title>Mean AUPRC on pneumonia for the average box and three models or methods</title><desc>Dot plot. RetinaNet 0.59, XRAI 0.52, average box 0.47, SIG 0.16.</desc><rect x="288.5" y="56" width="167.7" height="126" rx="4" fill="#E5EDE9"/><text x="372.35" y="18" fill="#566761" font-size="13.9" text-anchor="middle" font-weight="400">range of the saliency methods</text><line x1="214.0" y1="24" x2="214.0" y2="202" stroke="#DAE3DF" stroke-width="1" stroke-linecap="round"/><text x="214.0" y="218" fill="#566761" font-size="13.9" text-anchor="middle" font-weight="400">0.0</text><line x1="307.1" y1="24" x2="307.1" y2="202" stroke="#DAE3DF" stroke-width="1" stroke-linecap="round"/><text x="307.1" y="218" fill="#566761" font-size="13.9" text-anchor="middle" font-weight="400">0.2</text><line x1="400.3" y1="24" x2="400.3" y2="202" stroke="#DAE3DF" stroke-width="1" stroke-linecap="round"/><text x="400.3" y="218" fill="#566761" font-size="13.9" text-anchor="middle" font-weight="400">0.4</text><line x1="493.4" y1="24" x2="493.4" y2="202" stroke="#DAE3DF" stroke-width="1" stroke-linecap="round"/><text x="493.4" y="218" fill="#566761" font-size="13.9" text-anchor="middle" font-weight="400">0.6</text><text x="8" y="42" fill="#121C19" font-size="15.1" text-anchor="start" font-weight="600">RetinaNet</text><text x="8" y="57" fill="#566761" font-size="13.9" text-anchor="start" font-weight="400">a detection network</text><line x1="214" y1="46" x2="488.8" y2="46" stroke="#566761" stroke-width="2" stroke-linecap="round"/><circle cx="488.8" cy="46" r="6" fill="#566761" stroke="#FFFFFF" stroke-width="2"><title>RetinaNet: 0.59</title></circle><text x="499.8" y="50" fill="#121C19" font-size="14.5" text-anchor="start" font-weight="400">0.59</text><text x="8" y="88" fill="#121C19" font-size="15.1" text-anchor="start" font-weight="600">XRAI</text><text x="8" y="103" fill="#566761" font-size="13.9" text-anchor="start" font-weight="400">highest saliency method</text><line x1="214" y1="92" x2="456.2" y2="92" stroke="#566761" stroke-width="2" stroke-linecap="round"/><circle cx="456.2" cy="92" r="6" fill="#566761" stroke="#FFFFFF" stroke-width="2"><title>XRAI: 0.52</title></circle><text x="467.2" y="96" fill="#121C19" font-size="14.5" text-anchor="start" font-weight="400">0.52</text><text x="8" y="134" fill="#121C19" font-size="15.1" text-anchor="start" font-weight="600">Average box</text><text x="8" y="149" fill="#566761" font-size="13.9" text-anchor="start" font-weight="400">same box for every patient</text><line x1="214" y1="138" x2="432.9" y2="138" stroke="#0C594E" stroke-width="2" stroke-linecap="round"/><circle cx="432.9" cy="138" r="6" fill="#0C594E" stroke="#FFFFFF" stroke-width="2"><title>Average box: 0.47</title></circle><text x="443.9" y="142" fill="#121C19" font-size="14.5" text-anchor="start" font-weight="400">0.47</text><text x="8" y="180" fill="#121C19" font-size="15.1" text-anchor="start" font-weight="600">SIG</text><text x="8" y="195" fill="#566761" font-size="13.9" text-anchor="start" font-weight="400">lowest saliency method</text><line x1="214" y1="184" x2="288.5" y2="184" stroke="#566761" stroke-width="2" stroke-linecap="round"/><circle cx="288.5" cy="184" r="6" fill="#566761" stroke="#FFFFFF" stroke-width="2"><title>SIG: 0.16</title></circle><text x="299.5" y="188" fill="#121C19" font-size="14.5" text-anchor="start" font-weight="400">0.16</text></svg>
