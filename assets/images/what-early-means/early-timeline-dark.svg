<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 276" role="img" font-family="Helvetica, Arial, sans-serif"><title>The four claims of early detection on one patient timeline</title><desc>Schematic. A future event claim scores an exam before disease starts. A hidden disease claim scores an exam between disease start and the clinician acting. An acute alert speaks shortly before the clinician acts. A screening gain moves the diagnosis earlier and may leave the date of death unchanged.</desc><text x="170" y="18" fill="#8BA39B" font-size="13.9" text-anchor="middle" font-weight="400">Disease starts</text><line x1="170" y1="28" x2="170" y2="270" stroke="#213029" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><text x="320" y="18" fill="#8BA39B" font-size="13.9" text-anchor="middle" font-weight="400">Clinician acts</text><line x1="320" y1="28" x2="320" y2="270" stroke="#213029" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><text x="420" y="18" fill="#8BA39B" font-size="13.9" text-anchor="middle" font-weight="400">Diagnosis</text><line x1="420" y1="28" x2="420" y2="270" stroke="#213029" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><text x="530" y="18" fill="#8BA39B" font-size="13.9" text-anchor="middle" font-weight="400">Death</text><line x1="530" y1="28" x2="530" y2="270" stroke="#213029" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><text x="20" y="52" font-size="15" fill="#E6EFEB" style="paint-order:stroke;stroke:#0B1311;stroke-width:4px"><tspan font-weight="600">Future event</tspan><tspan fill="#8BA39B"> compared with age and known facts</tspan></text><rect x="20" y="60" width="150" height="8" rx="4" fill="#37C3AC"><title>Future event: when the model has to speak</title></rect><text x="20" y="108" font-size="15" fill="#E6EFEB" style="paint-order:stroke;stroke:#0B1311;stroke-width:4px"><tspan font-weight="600">Hidden disease</tspan><tspan fill="#8BA39B"> compared with the reading of the same exam</tspan></text><rect x="170" y="116" width="150" height="8" rx="4" fill="#37C3AC"><title>Hidden disease: when the model has to speak</title></rect><text x="20" y="164" font-size="15" fill="#E6EFEB" style="paint-order:stroke;stroke:#0B1311;stroke-width:4px"><tspan font-weight="600">Acute alert</tspan><tspan fill="#8BA39B"> compared with the clinician</tspan></text><rect x="270" y="172" width="50" height="8" rx="4" fill="#37C3AC"><title>Acute alert: when the model has to speak</title></rect><text x="20" y="220" font-size="15" fill="#E6EFEB" style="paint-order:stroke;stroke:#0B1311;stroke-width:4px"><tspan font-weight="600">Screening gain</tspan><tspan fill="#8BA39B"> compared with the same patients unscreened</tspan></text><line x1="412" y1="232" x2="240" y2="232" stroke="#37C3AC" stroke-width="2.5" stroke-linecap="round"/><path d="M230 232 l11 -6 v12 z" fill="#37C3AC"/><circle cx="420" cy="232" r="5" fill="#11201C" stroke="#37C3AC" stroke-width="2.5"><title>Usual date of diagnosis</title></circle><text x="230" y="254" fill="#8BA39B" font-size="13.9" text-anchor="start" font-weight="400">Diagnosis moves earlier. Death may not move.</text></svg>
