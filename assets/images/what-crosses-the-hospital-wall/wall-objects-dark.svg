<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 254" role="img" font-family="Helvetica, Arial, sans-serif"><title>The six objects that can leave a hospital in federated learning</title><desc>Six arrows cross the hospital boundary: gradient, model weights, sum under secure aggregation, part of a model, summary in a few components and score for each patient. A published attack was found on all but part of a model.</desc><rect x="8" y="40" width="130" height="198" rx="8" fill="#152420"/><text x="73.0" y="120" fill="#E6EFEB" font-size="16.2" text-anchor="middle" font-weight="600">Hospital</text><text x="73.0" y="138" fill="#8BA39B" font-size="13.9" text-anchor="middle" font-weight="400">patient records</text><text x="73.0" y="154" fill="#8BA39B" font-size="13.9" text-anchor="middle" font-weight="400">stay here</text><line x1="170" y1="28" x2="170" y2="244" stroke="#37C3AC" stroke-width="3" stroke-linecap="round"/><circle cx="196" cy="16" r="6" fill="#37C3AC" stroke="#11201C" stroke-width="2"><title>Published attack found</title></circle><text x="208" y="20" fill="#8BA39B" font-size="13.9" text-anchor="start" font-weight="400">attack found</text><circle cx="312" cy="16" r="5" fill="#11201C" stroke="#8BA39B" stroke-width="2"><title>No attack found</title></circle><text x="324" y="20" fill="#8BA39B" font-size="13.9" text-anchor="start" font-weight="400">none found</text><line x1="144" y1="62" x2="196" y2="62" stroke="#8BA39B" stroke-width="1.5" stroke-linecap="round"/><path d="M204 62 l-9 -5 v10 z" fill="#8BA39B"/><circle cx="220" cy="62" r="6" fill="#37C3AC" stroke="#11201C" stroke-width="2"><title>Gradient: published attack found</title></circle><text x="236" y="66" fill="#E6EFEB" font-size="15.1" text-anchor="start" font-weight="400">Gradient</text><line x1="144" y1="92" x2="196" y2="92" stroke="#8BA39B" stroke-width="1.5" stroke-linecap="round"/><path d="M204 92 l-9 -5 v10 z" fill="#8BA39B"/><circle cx="220" cy="92" r="6" fill="#37C3AC" stroke="#11201C" stroke-width="2"><title>Model weights: published attack found</title></circle><text x="236" y="96" fill="#E6EFEB" font-size="15.1" text-anchor="start" font-weight="400">Model weights</text><line x1="144" y1="122" x2="196" y2="122" stroke="#8BA39B" stroke-width="1.5" stroke-linecap="round"/><path d="M204 122 l-9 -5 v10 z" fill="#8BA39B"/><circle cx="220" cy="122" r="6" fill="#37C3AC" stroke="#11201C" stroke-width="2"><title>Sum under secure aggregation: published attack found</title></circle><text x="236" y="126" fill="#E6EFEB" font-size="15.1" text-anchor="start" font-weight="400">Sum under secure aggregation</text><line x1="144" y1="152" x2="196" y2="152" stroke="#8BA39B" stroke-width="1.5" stroke-linecap="round"/><path d="M204 152 l-9 -5 v10 z" fill="#8BA39B"/><circle cx="220" cy="152" r="5" fill="#11201C" stroke="#8BA39B" stroke-width="2"><title>Part of a model: no attack found</title></circle><text x="236" y="156" fill="#E6EFEB" font-size="15.1" text-anchor="start" font-weight="400">Part of a model</text><line x1="144" y1="182" x2="196" y2="182" stroke="#8BA39B" stroke-width="1.5" stroke-linecap="round"/><path d="M204 182 l-9 -5 v10 z" fill="#8BA39B"/><circle cx="220" cy="182" r="6" fill="#37C3AC" stroke="#11201C" stroke-width="2"><title>Summary in a few components: published attack found</title></circle><text x="236" y="186" fill="#E6EFEB" font-size="15.1" text-anchor="start" font-weight="400">Summary in a few components</text><line x1="144" y1="212" x2="196" y2="212" stroke="#8BA39B" stroke-width="1.5" stroke-linecap="round"/><path d="M204 212 l-9 -5 v10 z" fill="#8BA39B"/><circle cx="220" cy="212" r="6" fill="#37C3AC" stroke="#11201C" stroke-width="2"><title>Score for each patient: published attack found</title></circle><text x="236" y="216" fill="#E6EFEB" font-size="15.1" text-anchor="start" font-weight="400">Score for each patient</text></svg>
